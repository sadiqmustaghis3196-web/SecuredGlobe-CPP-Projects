</style></head><body><aside id="sidebar"><div class="brand"><div class="logo">◈</div><div>SecuredGlobe<small>BANKING MANAGEMENT</small></div></div><div class="section-label">WORKSPACE</div><nav id="nav"></nav><div class="side-bottom"><div class="section-label">ADMINISTRATION</div><nav id="adminnav"></nav><div class="secure"><span class="dot"></span>Demo workspace · Local storage<br><span style="color:#61788d;display:block;margin-top:9px">SecuredGlobe v1.0</span></div></div></aside><div class="shell"><header><div class="crumb"><button class="iconbtn mobile" onclick="document.querySelector('aside').classList.toggle('open')">☰</button> Workspace <span style="padding:0 10px">/</span> <b id="crumb">Overview</b></div><div class="top-right"><div class="search">⌕ <input placeholder="Search customers, accounts…" aria-label="Global search" id="globalSearch"><span class="key">⌘ K</span></div><button class="iconbtn" onclick="notifications()" aria-label="Notifications">♧</button><div class="profile"><div class="avatar">SA</div><div class="profile-name">Sadiq Ameen<small>Administrator</small></div><button class="iconbtn" aria-label="Profile" onclick="profile()">⌄</button></div></div></header><main id="main"></main></div><dialog id="modal"></dialog><div class="toast" role="status" id="toast"></div><script>
const $=s=>document.querySelector(s);const icons={Dashboard:'▦',Customers:'♧','Bank Accounts':'▣',Transactions:'⇄',Transfers:'↗',Deposits:'↓',Withdrawals:'↑',Loans:'▤',Cards:'▱',Employees:'♙',Branches:'⌂',Reports:'▥','Audit Logs':'☷','User Management':'♙',Settings:'⚙'};let page='Dashboard',search='',statusFilter='All',period='Month',pagination=1;
const names=['Olivia Rhye','Phoenix Baker','Lana Steiner','Demi Wilkinson','Drew Cano','Natali Craig','Orlando Diggs','Andi Lane','Kate Morrison','Ahmed Khan','Sarah Wilson','James Miller','Ayesha Malik','Michael Chen','Sophia Brown','Hassan Ali','Emma Davis','William Lee','Zara Ahmed','Noah Taylor','Isabella Clark','Ethan Hall','Mia Young','Lucas King','Amelia Scott','Henry Green','Charlotte Adams','Daniel Lewis','Grace Walker','Sadiq Ameen'];
const seed=()=>({customers:names.map((name,i)=>({id:'CUS-'+(1001+i),name,email:name.toLowerCase().replaceAll(' ','.')+'@example.com',phone:'+1 202 555 '+String(100+i),kyc:i%7?'Verified':'Pending',branch:['Downtown','Westside','Riverside'][i%3]})),accounts:Array.from({length:40},(_,i)=>({id:'SG'+(2084000101+i),customer:'CUS-'+(1001+i%30),type:i%3?'Savings':'Current',balance:(65000+i*23771),status:i===8?'Frozen':'Active'})),transactions:Array.from({length:108},(_,i)=>({id:'TXN-'+(40982-i),account:'SG'+(2084000101+i%40),name:names[i%30],type:['Deposit','Transfer','Withdrawal','Deposit','Withdrawal'][i%5],amount:(12500+i*3107),date:new Date(Date.now()-i*7*3600000).toISOString(),status:'Completed'})),loans:Array.from({length:12},(_,i)=>({id:'LN-'+(2001+i),customer:'CUS-'+(1001+i),amount:(1000000+i*250000),rate:8.5,term:24,status:['Pending','Approved','Approved','Rejected'][i%4],paid:0})),cards:Array.from({length:10},(_,i)=>({id:'•••• '+(4821+i*17),account:'SG'+(2084000101+i),status:i===5?'Blocked':'Active'})),employees:[{name:'Sadiq Ameen',role:'Administrator',branch:'Downtown'},{name:'Rachel Kim',role:'Bank Manager',branch:'Westside'},{name:'Adam Foster',role:'Bank Teller',branch:'Downtown'},{name:'Nina Patel',role:'Bank Teller',branch:'Riverside'}],audit:[],limit:2500000});let db;try{db=JSON.parse(localStorage.getItem('securedglobe-demo'))||seed()}catch{db=seed()}function persist(){localStorage.setItem('securedglobe-demo',JSON.stringify(db))}function audit(action){db.audit.unshift({action,date:new Date().toISOString(),user:'Sadiq Ameen'});persist()}function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v/100)}function compact(v){return '$'+new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(v/100)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function customer(a){return db.customers.find(c=>c.id===a.customer)?.name||'Unknown'}function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}function person(n,sub){return `<div class="person"><div class="initial">${initials(n)}</div><div class="name">${esc(n)}<small>${esc(sub)}</small></div></div>`}function pill(s){return `<span class="pill ${s}">${s}</span>`}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}function navigate(p){page=p;search='';pagination=1;statusFilter='All';$('#sidebar').classList.remove('open');render()}
function nav(){let all=Object.keys(icons);$('#nav').innerHTML=all.slice(0,12).map(n=>`<button class="nav ${page===n?'active':''}" onclick="navigate('${n}')"><span style="width:18px;font-size:17px">${icons[n]}</span>${n}${n==='Loans'?`<span class="badge">${db.loans.filter(l=>l.status==='Pending').length}</span>`:''}</button>`).join('');$('#adminnav').innerHTML=all.slice(12).map(n=>`<button class="nav ${page===n?'active':''}" onclick="navigate('${n}')"><span style="width:18px;font-size:17px">${icons[n]}</span>${n}</button>`).join('')}
function heading(title,sub,buttons=''){return `<div class="heading"><div><h1>${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${buttons}</div></div>`}function btn(text,action,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${action}">${text}</button>`}function stats(){let deposits=db.transactions.filter(t=>t.type==='Deposit').reduce((a,t)=>a+t.amount,0),balance=db.accounts.reduce((a,t)=>a+t.balance,0);return `<div class="stats">${[['Total account balance',money(balance),'↗','Across all customer accounts'],['Total customers',db.customers.length,'♧','Registered in your workspace'],['Active accounts',db.accounts.filter(a=>a.status==='Active').length,'▣','Savings & current accounts'],['Total deposits',money(deposits),'↓','Recorded transaction volume']].map(([label,val,ic,sub])=>`<div class="card stat"><div class="stat-top">${label}<span class="stat-icon">${ic}</span></div><div class="value">${val}</div><div class="trend"><b>↗ Live</b> ${sub}</div></div>`).join('')}</div>`}
function chart(){let count=period==='Week'?7:period==='Year'?12:14;let buckets=Array.from({length:count},(_,i)=>{let a=db.transactions.filter(t=>{let d=(Date.now()-new Date(t.date))/86400000;return period==='Week'?Math.floor(d)===i:period==='Year'?Math.floor(d/30)===i:Math.floor(d/2)===i});return [a.filter(t=>t.type==='Deposit').reduce((s,t)=>s+t.amount,0),a.filter(t=>t.type!=='Deposit').reduce((s,t)=>s+t.amount,0)]}).reverse();let max=Math.max(1,...buckets.flat());return `<div class="legend"><span><i></i>Money in</span><span><i class="blue"></i>Money out</span></div><svg viewBox="0 0 660 230" class="chart" role="img" aria-label="Transaction activity by ${period.toLowerCase()}">${[0,1,2,3,4].map(i=>`<line x1="50" y1="${15+i*44}" x2="650" y2="${15+i*44}" stroke="#eef1f4" stroke-dasharray="3 4"/><text x="0" y="${19+i*44}">${compact(max*(1-i/4))}</text>`).join('')}${buckets.map((v,i)=>{let x=65+i*580/count;return `<rect x="${x}" y="${191-v[0]/max*176}" width="${Math.max(7,210/count)}" height="${v[0]/max*176}" rx="3" fill="#2a9280"/><rect x="${x+Math.max(7,210/count)+3}" y="${191-v[1]/max*176}" width="${Math.max(7,210/count)}" height="${v[1]/max*176}" rx="3" fill="#b4c6df"/>${i%2===0?`<text x="${x}" y="218">${period==='Week'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]:period==='Year'?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][i]:String(i*2+1).padStart(2,'0')}</text>`:''}`}).join('')}</svg>`}
function dashboard(){return heading('Overview',"Welcome back, Sadiq. Here’s what’s happening at your bank today.",btn('↧ Export report','exportCSV()')+btn('＋ New transaction',"transaction('Transfer')",true))+stats()+`<div class="grid"><div><section class="card panel"><div class="panel-head"><div><h2>Transaction activity</h2><span class="panel-sub">A closer look at your cash flow</span></div><div class="seg">${['Week','Month','Year'].map(p=>`<button class="${period===p?'on':''}" onclick="period='${p}';render()">${p}</button>`).join('')}</div></div>${chart()}</section>${transactionTable(true)}</div><div class="right-col"><section class="card panel"><h2>Quick actions</h2><div class="panel-sub">Your everyday banking, simplified</div><div class="quick-grid">${[['↓','Deposit',"transaction('Deposit')"],['↑','Withdraw',"transaction('Withdrawal')"],['⇄','Transfer',"transaction('Transfer')"],['＋','Open account','openAccount()']].map(([i,t,a])=>`<button class="quick" onclick="${a}"><span>${i}</span>${t}</button>`).join('')}</div></section><section class="card panel lower"><div class="panel-head"><h2>Loan overview</h2><button class="view" onclick="navigate('Loans')">View all ↗</button></div><div class="ring-row"><div class="ring" style="background:conic-gradient(#268c7c 0 ${db.loans.filter(l=>l.status==='Approved').length/db.loans.length*100}%,#c6dcd4 0 ${(db.loans.filter(l=>['Approved','Pending'].includes(l.status)).length)/db.loans.length*100}%,#edf2f1 0)"><div class="ring-inner">${db.loans.length}<small>Total applications</small></div></div><div class="ring-key">${['Approved','Pending','Rejected'].map((s,i)=>`<div><span class="dot" style="background:${['#268c7c','#c6dcd4','#e3eae6'][i]}"></span>${s}<b>${db.loans.filter(l=>l.status===s).length}</b></div>`).join('')}</div></div><div class="notice"><span>◷ ${db.loans.filter(l=>l.status==='Pending').length} applications need review</span><button class="view" onclick="navigate('Loans')">→</button></div></section><section class="card panel lower branch-panel"><div class="panel-head"><h2>Branch activity</h2><button class="view" onclick="navigate('Branches')">•••</button></div>${['Downtown','Westside','Riverside'].map((b,i)=>`<div class="branch"><div>${b} Branch<small>${['New York, NY','Brooklyn, NY','Queens, NY'][i]}</small></div><strong>${db.customers.filter(c=>c.branch===b).length} <small>customers</small></strong></div>`).join('')}</section></div></div>`}
function table(title,sub,headers,rows,extra='',controls=true){let filtered=rows.filter(r=>!search||r.join(' ').replace(/<[^>]+>/g,'').toLowerCase().includes(search.toLowerCase()));let size=page==='Dashboard'?5:8,total=Math.ceil(filtered.length/size)||1;pagination=Math.min(pagination,total);return `<section class="card table-card"><div class="panel-head table-head"><div><h2>${title}</h2><div class="panel-sub">${sub}</div></div>${extra}</div>${controls?`<div class="table-controls"><input class="filterinput" id="tableSearch" placeholder="⌕  Search ${title.toLowerCase()}…" value="${esc(search)}" oninput="search=this.value;pagination=1;refreshTable()"><div class="actions">${btn('↧ Export','exportCSV()')}</div></div>`:''}<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${filtered.slice((pagination-1)*size,pagination*size).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="empty">No records match your search.</td></tr>`}</tbody></table></div><div class="table-foot"><span>Showing ${filtered.length?((pagination-1)*size+1):0}–${Math.min(pagination*size,filtered.length)} of ${filtered.length} records</span><div>${btn('←',`pagination=Math.max(1,pagination-1);render()`)} <span class="page">${pagination}</span> ${btn('→',`pagination=Math.min(${total},pagination+1);render()`)}</div></div></section>`}
function transactionTable(recent=false){let ts=db.transactions.filter(t=>statusFilter==='All'||t.type===statusFilter);return table(recent?'Recent transactions':'All transactions',recent?'The latest movements across your accounts':'A complete record of deposits, withdrawals, and transfers',['TRANSACTION ID','CUSTOMER','TYPE','AMOUNT','STATUS',''],ts.map(t=>[`<span style="color:#728496">#${t.id}</span>`,person(t.name,new Date(t.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})),`<span style="color:#758896">${t.type==='Deposit'?'↙':t.type==='Transfer'?'⇄':'↗'} ${t.type}</span>`,`<span class="money ${t.type==='Deposit'?'positive':'negative'}">${t.type==='Deposit'?'+':'−'}${money(t.amount)}</span>`,pill(t.status),`<button class="view" onclick="receipt('${t.id}')">↗</button>`]),recent?`<button class="view" onclick="navigate('Transactions')">View all transactions ↗</button>`:`<select class="filterinput" aria-label="Transaction type" onchange="statusFilter=this.value;render()">${['All','Deposit','Withdrawal','Transfer'].map(t=>`<option ${statusFilter===t?'selected':''}>${t}</option>`).join('')}</select>`,!recent)}

else if(page==='Settings')content=heading('Workspace settings','Configure your demonstration environment.')+`<div class="card panel" style="max-width:720px"><h2>Transaction limits</h2><p class="subtitle">Maximum withdrawal or transfer per transaction.</p><form onsubmit="event.preventDefault();db.limit=Math.round(Number(this.limit.value)*100);audit('Updated transaction limit');toast('Settings saved')"><label>Limit (USD)<input name="limit" type="number" min="1" step=".01" value="${db.limit/100}" required></label><div>${btn('Save changes','',true)}</div></form><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h2>Data backup</h2><p class="subtitle">Download all demo records as JSON, or restore a previous backup.</p><div class="actions">${btn('↓ Download backup','backup()')}<label class="btn">↑ Restore backup<input type="file" accept="application/json" style="display:none" onchange="restore(this.files[0])"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h2>About this workspace</h2><p class="subtitle" style="line-height:1.9">SecuredGlobe web demonstration. All data is fictional and stored in this browser. This site does not connect to a bank or process real payments. Desktop C++ / Qt functionality and multi-user authentication are outside this web demo.</p></div>`;

function refreshTable(){let p=$('#tableSearch')?.selectionStart;render();let el=$('#tableSearch');el?.focus();el?.setSelectionRange(p,p)}function modal(title,sub,body){$('#modal').innerHTML=`<h2>${title}</h2><p class="subtitle" style="line-height:1.7;margin-bottom:23px">${sub}</p>${body}`;$('#modal').showModal()}function formModal(title,sub,fields,submit){modal(title,sub,`<form id="form">${fields}<div class="error" id="error" role="alert"></div><div class="dialog-actions"><button type="button" class="btn" onclick="$('#modal').close()">Cancel</button><button class="btn primary">Confirm ${title.toLowerCase()}</button></div></form>`);$('#form').onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(e.target)));$('#modal').close();render()}catch(err){$('#error').textContent=err.message}}}function field(label,name,type='text',value=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required ${type==='number'?'min="0.01" step="0.01"':''}></label>`}function select(label,name,opts){return `<label>${label}<select name="${name}" required>${opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></label>`}function accountOpts(){return db.accounts.filter(a=>a.status==='Active').map(a=>[a.id,a.id+' · '+customer(a)+' · '+money(a.balance)])}
function transaction(type){formModal(type,type==='Transfer'?'Move funds between two active demo accounts.':'Record a cash '+type.toLowerCase()+' on an active account.',select('Account','account',accountOpts())+(type==='Transfer'?select('Recipient account','recipient',accountOpts()):'')+field('Amount (USD)','amount','number')+field('Reference / note','note'),v=>{let amount=Math.round(Number(v.amount)*100),a=db.accounts.find(a=>a.id===v.account),b=db.accounts.find(a=>a.id===v.recipient);if(!Number.isSafeInteger(amount)||amount<=0)throw Error('Enter a valid positive amount.');if(!a||a.status!=='Active')throw Error('Account is unavailable.');if(type!=='Deposit'&&amount>db.limit)throw Error('Amount exceeds the transaction limit.');if(type!=='Deposit'&&a.balance<amount)throw Error('Insufficient account balance.');if(type==='Transfer'&&(!b||b.status!=='Active'||a.id===b.id))throw Error('Choose a different active recipient account.');if(!Number.isSafeInteger(a.balance+amount)||b&&!Number.isSafeInteger(b.balance+amount))throw Error('Amount is too large.');a.balance+=type==='Deposit'?amount:-amount;if(type==='Transfer')b.balance+=amount;let t={id:'TXN-'+Date.now(),account:a.id,recipient:b?.id,name:customer(a),type,amount,date:new Date().toISOString(),status:'Completed',note:v.note};db.transactions.unshift(t);audit(type+' '+money(amount)+' · '+a.id);toast(type+' completed · '+t.id)})}
function addCustomer(existing){formModal(existing?'Edit customer':'Add customer','Register customer information in your demo workspace.',field('Full name','name','text',existing?.name)+field('Email','email','email',existing?.email)+field('Phone','phone','tel',existing?.phone)+select('Branch','branch',['Downtown','Westside','Riverside'].map(b=>[b,b])),v=>{if(v.name.trim().length<2)throw Error('Enter a full customer name.');if(db.customers.some(c=>c.email===v.email&&c.id!==existing?.id))throw Error('This email is already registered.');if(existing)Object.assign(existing,v);else db.customers.unshift({...v,id:'CUS-'+Date.now(),kyc:'Pending'});audit((existing?'Edited':'Created')+' customer '+v.name);toast('Customer saved')})}
function customerDetail(id){let c=db.customers.find(c=>c.id===id),as=db.accounts.filter(a=>a.customer===id);modal(c.name,c.id+' · '+c.email,`<p>Branch: ${c.branch}</p><p>KYC status: ${pill(c.kyc)}</p><p>Total balance: <b>${money(as.reduce((s,a)=>s+a.balance,0))}</b></p>${as.map(a=>`<p>${a.id} · ${a.type} · ${money(a.balance)}</p>`).join('')}<div class="dialog-actions">${btn('Edit customer',`$('#modal').close();addCustomer(db.customers.find(c=>c.id==='${id}'))`)}${c.kyc==='Pending'?btn('Verify KYC',`verifyKYC('${id}')`,true):''}${btn('Close',"$('#modal').close()")}</div>`)}function verifyKYC(id){db.customers.find(c=>c.id===id).kyc='Verified';audit('Verified demo KYC '+id);$('#modal').close();render();toast('Demo KYC marked verified')}
function openAccount(){formModal('Open account','Create a new account for an existing verified customer.',select('Customer','customer',db.customers.filter(c=>c.kyc==='Verified').map(c=>[c.id,c.name]))+select('Account type','type',[['Savings','Savings'],['Current','Current']]),v=>{if(!db.customers.some(c=>c.id===v.customer&&c.kyc==='Verified'))throw Error('A verified customer is required.');let a={id:'SG'+Date.now(),customer:v.customer,type:v.type,balance:0,status:'Active'};db.accounts.unshift(a);audit('Opened account '+a.id);toast('Account opened with a zero balance')})}
function accountDetail(id){let a=db.accounts.find(a=>a.id===id);modal('Account details',id+' · '+customer(a),`<div class="value">${money(a.balance)}</div><p>${a.type} account · ${pill(a.status)}</p><p class="subtitle">Frozen accounts cannot transact. Closure requires a zero balance and no outstanding loans.</p><div class="dialog-actions">${a.status!=='Closed'?btn(a.status==='Active'?'Freeze account':'Unfreeze account',`setAccount('${id}','${a.status==='Active'?'Frozen':'Active'}')`)+btn('Close account',`setAccount('${id}','Closed')`):''}${btn('Done',"$('#modal').close()",true)}</div><p class="error" id="accountError"></p>`)}function setAccount(id,status){let a=db.accounts.find(a=>a.id===id);if(status==='Closed'&&(a.balance!==0||db.loans.some(l=>l.customer===a.customer&&['Approved','Pending'].includes(l.status)))){$('#accountError').textContent='Closure requires zero balance and no pending or outstanding loans.';return}a.status=status;audit('Account '+id+' changed to '+status);$('#modal').close();render();toast('Account status updated')}
function applyLoan(){formModal('Loan application','Fixed annual interest rate of 8.5%. Approval credits the chosen customer’s first active account.',select('Customer','customer',db.customers.filter(c=>c.kyc==='Verified').map(c=>[c.id,c.name]))+field('Principal (USD)','amount','number')+select('Term','term',[[12,'12 months'],[24,'24 months'],[36,'36 months']]),v=>{let amount=Math.round(+v.amount*100);if(!Number.isSafeInteger(amount)||amount<=0)throw Error('Invalid principal.');db.loans.unshift({id:'LN-'+Date.now(),customer:v.customer,amount,term:+v.term,rate:8.5,status:'Pending',paid:0});audit('Loan application submitted');toast('Loan application submitted')})}function loanDetail(id){let l=db.loans.find(l=>l.id===id),r=l.rate/1200,payment=Math.round(l.amount*r/(1-Math.pow(1+r,-l.term))),total=payment*l.term;modal('Loan '+id,customer(l)+' · '+l.status,`<div class="value">${money(l.amount)}</div><p>Annual rate: ${l.rate}% · Term: ${l.term} months</p><p>Monthly repayment: <b>${money(payment)}</b></p><p>Scheduled total: ${money(total)} · Paid: ${money(l.paid)}</p><p class="subtitle">Amortization: P × r ÷ (1 − (1 + r)<sup>−n</sup>), rounded to cents.</p><div class="dialog-actions">${l.status==='Pending'?btn('Reject',`decideLoan('${id}',false)`)+btn('Approve & disburse',`decideLoan('${id}',true)`,true):l.status==='Approved'?btn('Record repayment',`$('#modal').close();repay('${id}',${total})`,true):''}${btn('Close',"$('#modal').close()")}</div><p class="error" id="loanError"></p>`)}function decideLoan(id,approve){let l=db.loans.find(l=>l.id===id);if(l.status!=='Pending')return;let a=db.accounts.find(a=>a.customer===l.customer&&a.status==='Active');if(approve&&!a){$('#loanError').textContent='This customer needs an active account first.';return}if(approve){a.balance+=l.amount;db.transactions.unshift({id:'TXN-'+Date.now(),account:a.id,name:customer(a),type:'Deposit',amount:l.amount,date:new Date().toISOString(),status:'Completed',note:'Loan disbursement '+id})}l.status=approve?'Approved':'Rejected';audit(l.status+' loan '+id);$('#modal').close();render();toast('Loan '+l.status.toLowerCase())}function repay(id,total){let l=db.loans.find(l=>l.id===id);formModal('Loan repayment','Payment is debited from the selected customer account.',select('Account','account',db.accounts.filter(a=>a.customer===l.customer&&a.status==='Active').map(a=>[a.id,a.id+' · '+money(a.balance)]))+field('Amount (USD)','amount','number'),v=>{let n=Math.round(+v.amount*100),a=db.accounts.find(a=>a.id===v.account);if(!a||n>a.balance)throw Error('Insufficient funds.');if(n<=0||n>total-l.paid)throw Error('Amount exceeds the outstanding loan balance.');a.balance-=n;l.paid+=n;if(l.paid===total)l.status='Repaid';db.transactions.unshift({id:'TXN-'+Date.now(),account:a.id,name:customer(a),type:'Withdrawal',amount:n,date:new Date().toISOString(),status:'Completed',note:'Loan repayment '+id});audit('Loan repayment '+money(n)+' · '+id);toast('Repayment recorded')})}
function issueCard(){formModal('Issue card','Creates a masked demo card identifier. No payment credentials are generated.',select('Account','account',accountOpts()),v=>{db.cards.unshift({id:'•••• '+String(1000+crypto.getRandomValues(new Uint32Array(1))[0]%9000),account:v.account,status:'Active'});audit('Issued demo card for '+v.account);toast('Demo card issued')})}function toggleCard(i){db.cards[i].status=db.cards[i].status==='Active'?'Blocked':'Active';audit('Card '+db.cards[i].id+' '+db.cards[i].status);render();toast('Card updated')}function addEmployee(){formModal('Add team member','Add a team record. This does not create an authenticated user.',field('Full name','name')+select('Role','role',['Administrator','Bank Manager','Bank Teller'].map(x=>[x,x]))+select('Branch','branch',['Downtown','Westside','Riverside'].map(x=>[x,x])),v=>{db.employees.push(v);audit('Added team member '+v.name);toast('Team member added')})}
function receipt(id){let t=db.transactions.find(t=>t.id===id);modal('Transaction receipt',t.id,`<p>${pill(t.status)}</p><div class="value">${money(t.amount)}</div><p>${t.type} · ${esc(t.name)}</p><p>Account: ${t.account}</p>${t.recipient?`<p>Recipient: ${t.recipient}</p>`:''}<p>${new Date(t.date).toLocaleString()}</p><p>Reference: ${esc(t.note||'Banking transaction')}</p><p class="subtitle">Demonstration receipt · No real funds processed</p><div class="dialog-actions">${btn('Print / Save PDF','window.print()',true)}${btn('Close',"$('#modal').close()")}</div>`)}function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCSV(){let key={Customers:'customers','Bank Accounts':'accounts',Loans:'loans',Cards:'cards',Employees:'employees','User Management':'employees','Audit Logs':'audit'}[page]||'transactions',rows=db[key];if(!rows.length){toast('No records to export');return}let keys=Object.keys(rows[0]);download('SecuredGlobe-'+key+'.csv',[keys,...rows.map(r=>keys.map(k=>r[k]??''))].map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"' $&").replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv');toast('CSV exported')}function backup(){download('SecuredGlobe-backup.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded')}async function restore(file){if(!file)return;try{let data=JSON.parse(await file.text());for(let key of ['customers','accounts','transactions','loans','cards','employees','audit'])if(!Array.isArray(data[key]))throw Error('Invalid backup structure');if(!data.accounts.every(a=>typeof a.id==='string'&&Number.isSafeInteger(a.balance))||!Number.isSafeInteger(data.limit))throw Error('Invalid account data');db=data;audit('Restored demo backup');render();toast('Backup restored')}catch(e){toast('Could not restore: '+e.message)}}function notifications(){modal('Notifications','Your workspace at a glance',`<p>◷ ${db.loans.filter(l=>l.status==='Pending').length} loan applications awaiting review</p><p>♧ ${db.customers.filter(c=>c.kyc==='Pending').length} customers awaiting demo KYC verification</p><p>▣ ${db.accounts.filter(a=>a.status==='Frozen').length} frozen accounts</p><div class="dialog-actions">${btn('Review loans',"$('#modal').close();navigate('Loans')",true)}${btn('Close',"$('#modal').close()")}</div>`)}function profile(){modal('Sadiq Ameen','Administrator · Demo session',`<p>You are viewing the fictional SecuredGlobe banking workspace.</p><p class="subtitle">Data is stored only in this browser. This demo session does not use password authentication.</p><div class="dialog-actions">${btn('Workspace settings',"$('#modal').close();navigate('Settings')",true)}${btn('Close',"$('#modal').close()")}</div>`)}$('#globalSearch').addEventListener('input',e=>{page='Customers';search=e.target.value;pagination=1;render()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#globalSearch').focus()}});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});persist();render();
</script><style>@media print{aside,header,.heading .actions,.table-controls,.bottom,.dialog-actions,.toast{display:none!important}.shell{margin:0}main{padding:0}.card{break-inside:avoid}body:has(dialog[open]) main{display:none}dialog[open]{position:static;width:100%;box-shadow:none;border:0}dialog::backdrop{background:white}}</style></body></html>
